version: '3.8'

services:
  crewai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crewai_sandboxed_agent
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OPENAI_API_KEY=ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agent_workspace:/app/workspace